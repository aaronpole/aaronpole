name: Update ASCII portrait

on:
  push:
    paths:
      - "assets/photo-ready.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependencies
        run: pip install -r tools/requirements-art.txt

      - name: Regenerate portrait SVG
        run: python tools/render_portrait.py

      - name: Commit updated portrait
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: regenerate portrait SVG"
          file_pattern: portrait.svg
